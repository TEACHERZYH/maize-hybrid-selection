[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maize-hybrid-selection"
version = "0.1.0"
description = "Reproduction code for sparse-support adaptation and maize hybrid selection experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "threadpoolctl>=3.2",
  "torch>=2.1",
  "rtdl-num-embeddings>=0.0.11",
  "typing-extensions>=4.8",
]

[tool.setuptools]
packages = ["analysis_v126", "analysis_v126.vendor", "g2f_design"]
package-dir = {"g2f_design" = "src/g2f_design"}
